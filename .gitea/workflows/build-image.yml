name: Build Docker Image

# 2026-07-17：构建从 NAS runner（nas-runner-1）迁到云端 runner（cloud-runner-1，
# 跑在 118.25.114.29 = git.aifacely.net 宿主机）。NAS 那台在加密机械盘上构建慢到
# 不可用（同类项目 nas-auth 实测 27-42 分钟，迁过来热缓存 1 分 57 秒）。
#
# ⚠️ 本仓是公开仓（上游 fork）。部署目标主机 / host key 一律走 secrets，不写正文：
#   secrets.NAS_CI_SSH_KEY           部署用私钥
#   secrets.NAS_SSH_HOST             部署目标主机
#   secrets.NAS_SSH_KNOWN_HOSTS      目标主机 host key（固定，不用 accept-new）
#   secrets.AIFACELY_REGISTRY_TOKEN  推镜像用，需 read:package + write:package
#
# 迁回 NAS runner 时要改回来的五处（git log 里 2026-07-17 那次 commit 是完整对照）：
#   1. registry / 镜像引用改回 git.zhengchentao.win/zhengchen.tao/ezbookkeeping
#   2. action 引用改回 git.zhengchentao.win/mirror/*（那边也有同名镜像仓）
#   3. 加回 setup-buildx-action 并钉 moby/buildkit:v0.13.2（DSM 老内核 4.4.x 上
#      runc 1.2+ 的 procfs 安全检查撞 openat2/fsmount 不存在）
#   4. nas-infra 里 ezbookkeeping/docker-compose.yml 的 image 引用改回去
#   5. deploy 改回独立 job + 临时 clone nas-infra 跑 compose

on:
  # 自动触发：push 到 custom 分支时跑（force-push 后的 rebase 也会触发，可接受）
  # paths-ignore：纯文档/配置改动跳过，避免浪费构建
  # ⚠️ 已知 quirk（2026-05-02 验证）：empty commit（git commit --allow-empty）
  # 不会触发 paths-ignore 过滤的 workflow，Gitea 把 zero-paths-changed 当作
  # "vacuously matches ignore list" 跳过。要强制触发必须至少改一个非 ignore 路径
  # 的真实文件（改这个 yml 自己最稳）。
  push:
    branches: [custom]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'screenshot/**'
      # sync-upstream.yml 改的是 main reset 逻辑，跟 build 无关
      # build-image.yml 自己留着会触发，作为 workflow 改动的 self-test
      - '.gitea/workflows/sync-upstream.yml'
  # 手动触发：保留作为应急通道（重新打包旧 commit、用自定义 tag 等等）
  workflow_dispatch:
    inputs:
      branch:
        description: '要打包的分支（仅手动触发生效）'
        required: true
        default: 'custom'
      tag:
        description: '镜像 tag（留空则用 commit short hash）'
        required: false
        default: ''

# 并发控制：同一分支的连续 push 只跑最新的，旧 in-progress run 会被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.aifacely.net
  IMAGE: git.aifacely.net/zhengchen.tao/ezbookkeeping

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 走 Gitea 镜像仓的全 URL 引用 —— 对云端 runner 就是本机，clone 秒级。
      # 用 `actions/checkout@v4` 短写法会被解析到 github.com，那台机在国内拉不动
      # （实测 connection timed out / unexpected EOF）。
      - name: Checkout target branch
        uses: https://git.aifacely.net/mirror/checkout@v4
        with:
          # workflow_dispatch 时用用户填的 branch；push 触发时 inputs.branch 为空，
          # fallback 到 github.ref_name
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      # 不用 setup-buildx-action：mirror 里没有它，这里也不需要 —— 默认 docker
      # driver 直接用宿主 daemon 的构建缓存，跨 run 持久。

      - name: Login to Gitea Container Registry
        uses: https://git.aifacely.net/mirror/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: zhengchen.tao
          password: ${{ secrets.AIFACELY_REGISTRY_TOKEN }}

      - name: Determine image tag and revision
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="$(git rev-parse --short HEAD)"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "==> Image tag: $IMAGE_TAG"

      - name: Build and push
        uses: https://git.aifacely.net/mirror/build-push-action@v6
        with:
          context: .
          push: true
          # provenance/sbom 关掉：默认会多推一层 attestation manifest，
          # Gitea registry 支持不好。
          provenance: false
          sbom: false
          # 上游 Dockerfile 用 BUILD_PIPELINE 作为 CI 跳过开关：
          # 设为 "1" 时 pkg/exchangerates 跳过依赖第三方 API 的活测试
          # （加拿大银行/乌兹别克央行 API 国内不稳，跑就超时）
          build-args: |
            BUILD_PIPELINE=1
          # image.source 仍指 git.zhengchentao.win —— 那才是本仓事实源，镜像只是
          # 暂存在 git.aifacely.net。nas-janitor 的清理靠这个精确值找自家产物。
          # revision 把构建时的 commit full SHA 烙进 manifest，docker inspect 能反推。
          labels: |
            org.opencontainers.image.source=https://git.zhengchentao.win/zhengchen.tao/ezbookkeeping
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE }}:latest

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| Runner | \`cloud-runner-1\`（云端，docker 模式） |"
            echo "| 源分支 | \`${{ inputs.branch || github.ref_name }}\` |"
            echo "| 源 commit (full) | \`${{ steps.meta.outputs.full_sha }}\` |"
            echo "| 源 commit (short) | \`${{ steps.meta.outputs.image_tag }}\` |"
            echo "| 镜像 tag | \`${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}\` + \`:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- deploy ----
      # 原来是独立 job：临时 clone infra 仓到 tmpdir 再跑 compose（runner 容器挂了
      # host docker.sock）。现在合并进 build job，改成 ssh 过去触发 —— 目标侧用的是
      # 正式部署目录，比临时 clone 更接近真实部署状态（临时 clone 拿不到同目录的
      # .env.shared）。
      #
      # NAS 侧是 ssh 强制命令（nas-infra/scripts/ci-deploy.sh），这把 key 只能触发
      # 白名单内的 compose 重启，拿不到 shell —— tao 在 sudoers 里是 NOPASSWD: ALL，
      # 裸 key 等于把 NAS root 交给这个 job。ssh 最后那个参数会被当成
      # SSH_ORIGINAL_COMMAND 做白名单精确匹配，不是在 NAS 上执行的 shell 命令。
      - name: Deploy to NAS
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.NAS_CI_SSH_KEY }}" > ~/.ssh/nas_ci
          chmod 600 ~/.ssh/nas_ci
          printf '%s\n' "${{ secrets.NAS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts_nas
          chmod 600 ~/.ssh/known_hosts_nas
          ssh -i ~/.ssh/nas_ci \
              -o UserKnownHostsFile=~/.ssh/known_hosts_nas \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              tao@${{ secrets.NAS_SSH_HOST }} "deploy ezbookkeeping"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/nas_ci
