name: Validate Dependency Candidate

on:
  push:
    branches: [codex/dependency-audit-fix-2026-10-27]
    paths:
      - package.json
      - package-lock.json
      - .gitea/workflows/dependency-candidate.yml

concurrency:
  group: dependency-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGE_TAG: ezbookkeeping-deps-check:${{ github.run_id }}
    steps:
      - name: Checkout dependency candidate
        uses: https://git.aifacely.net/mirror/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frontend with the standard Dockerfile
        run: |
          docker buildx build \
            --target fe-builder \
            --load \
            --tag "$STAGE_TAG" \
            --build-arg BUILD_PIPELINE=1 \
            --build-arg BUILD_NODE_OPTIONS=--max-old-space-size=4096 \
            --build-arg HTTP_PROXY=http://172.17.0.1:10809 \
            --build-arg HTTPS_PROXY=http://172.17.0.1:10809 \
            --build-arg NO_PROXY=localhost,127.0.0.1 \
            .
      - name: Remove only this run's stage image
        if: always()
        run: |
          if docker image inspect "$STAGE_TAG" >/dev/null 2>&1; then
            docker image rm "$STAGE_TAG"
          fi
